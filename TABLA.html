function generarFechas(cantidad = 10) {
  const dias = [];
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  while (dias.length < cantidad) {
    const dow = cursor.getDay();
    if (dow >= 1 && dow <= 5) {
      const yyyy = cursor.getFullYear();
      const mm = String(cursor.getMonth() + 1).padStart(2, "0");
      const dd = String(cursor.getDate()).padStart(2, "0");
      const etiqueta = cursor.toLocaleDateString("es-CO", { weekday: "short", day: "numeric", month: "short" });
      dias.push({
        fecha: `${yyyy}-${mm}-${dd}`,
        etiqueta: etiqueta.charAt(0).toUpperCase() + etiqueta.slice(1),
        horario: dow === 5 ? "B" : "A",
      });
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return dias;
}

const FECHAS = generarFechas(10);
let fechaActiva = FECHAS[0].fecha;
let modalSlotKey = null;
let modalInstance = null;

async function verificarSesion() {
  let logrado = false;
  try {
    const resp = await fetch(API_SESION);
    if (resp.ok) {
      const data = await resp.json();
      if (data && data.autenticado && data.usuario) {
        usuarioLogueado = data.usuario;
        localStorage.setItem("usuarioINEM", JSON.stringify(usuarioLogueado));
        aplicarUIUsuario();
        logrado = true;
      }
    }
  } catch (err) {
    console.warn("Servidor PHP no alcanzado, revisando almacenamiento local.");
  }

  if (!logrado) {
    const sesionLocal = localStorage.getItem("usuarioINEM");
    if (sesionLocal) {
      try {
        usuarioLogueado = JSON.parse(sesionLocal);
        aplicarUIUsuario();
      } catch (e) {
        console.error("Error al decodificar sesión local:", e);
      }
    }
  }
}

  const logoutLink = document.getElementById("logoutLink");
  const userNameText = document.getElementById("userNameText");

  if (sessionLink) sessionLink.style.display = "none";
  if (registerLink) registerLink.style.display = "none";
  if (userLink && userNameText) {
    userNameText.textContent = usuarioLogueado.nombre;
    userLink.style.display = "inline-flex";
  }
  if (logoutLink) logoutLink.style.display = "inline-flex";
}

function cerrarSesionLocal(e) {
  localStorage.removeItem("usuarioINEM");
}

function renderTabs() {
  const cont = document.getElementById("dayTabs");
  cont.innerHTML = FECHAS.map(f => {
    const esActivo = f.fecha === fechaActiva;
    return `
      <button class="day-tab-btn ${esActivo ? 'active' : ''}" onclick="setFecha('${f.fecha}')">
        <span>${f.etiqueta}</span>
        <span class="badge-horario">H${f.horario}</span>
      </button>
    `;
  }).join("");
}

function setFecha(fecha) {
  fechaActiva = fecha;
  renderTabs();
  cargarReservas();
}

async function cargarReservas() {
  reservasPorSlot = {};
  try {
    const url = `${API_BASE}?bloque=${encodeURIComponent(BLOQUE_ACTUAL)}&salon=${encodeURIComponent(SALON_ACTUAL)}&fecha=${encodeURIComponent(fechaActiva)}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("Sin respuesta de servidor");
    const reservas = await resp.json();

    reservas.forEach(r => {
      const slotKey = `${r.fecha}_${r.periodo}`;
      reservasPorSlot[slotKey] = r;
    });
  } catch (err) {
    console.warn("Visualización aislada o sin reservas creadas aún.");
  }
  renderSchedule();
}

function renderSchedule() {
  const diaConfig = FECHAS.find(f => f.fecha === fechaActiva);
  const horario = diaConfig.horario === "B" ? HORARIO_B : HORARIO_A;
  const grid = document.getElementById("scheduleGrid");
  grid.innerHTML = "";

  horario.forEach((slot) => {
    const el = document.createElement("div");

    if (slot.tipo === "descanso") {
      el.innerHTML = `
        <div class="descanso-bar">
          <i class="material-icons" style="font-size: 20px;">free_breakfast</i>
          <span>DESCANSO</span>
          <span style="font-weight:400; opacity:0.85;">(${slot.hora})</span>
        </div>`;
      grid.appendChild(el);
      return;
    }

    if (slot.tipo === "fin") {
      el.innerHTML = `
        <div class="fin-jornada-bar">
          <i class="material-icons" style="font-size: 20px;">flag</i>
          <span>${slot.label.toUpperCase()}</span>
          <span style="font-weight:400; opacity:0.85;">(${slot.hora})</span>
        </div>`;
      grid.appendChild(el);
      return;
    }

    const slotKey = `${fechaActiva}_${slot.p}`;
    const infoSlot = reservasPorSlot[slotKey] || null;
    const estadoReal = infoSlot ? "ocupado" : "libre";

    el.className = `slot-card ${estadoReal}`;

    let infoResumen = "Disponible para reservar";
    if (infoSlot) {
      const grupoText = (infoSlot.grado || infoSlot.seccion) ? ` [${infoSlot.grado || ''}-${infoSlot.seccion || ''}]` : '';
      infoResumen = `${infoSlot.materia}${grupoText} · ${infoSlot.responsable}`;
    }

    const accionHTML = estadoReal === "libre"
      ? `<button class="btn-reservar-sm" onclick="intentarAbrirModal('${slotKey}','${slot.hora}');event.stopPropagation()"><i class="material-icons" style="font-size:16px;">add</i> Reservar</button>`
      : `<span class="status-badge ocupado">Ocupado</span>`;

    el.innerHTML = `
      <div class="slot-header" onclick="toggleDetalle('${slotKey}')">
        <div class="slot-time-group">
          <span class="slot-period">${slot.p}</span>
          <span class="slot-hora">${slot.hora}</span>
        </div>
        <div class="slot-info-summary hide-on-small-only">${infoResumen}</div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${accionHTML}
          <i class="material-icons grey-text" id="chevron-${slotKey}" style="transition: transform .3s;">expand_more</i>
        </div>
      </div>
      <div class="slot-detail" id="detail-${slotKey}">
        <div class="slot-detail-content">
          ${buildDetalle(slotKey, slot, estadoReal, infoSlot)}
        </div>
      </div>
    `;
    grid.appendChild(el);
  });
}

function buildDetalle(slotKey, slot, estado, infoSlot) {
  if (estado === "ocupado" && infoSlot) {
    return `
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div><b>Materia / Asignatura:</b> ${infoSlot.materia || '—'}</div>
        <div><b>Grado / Grupo:</b> ${infoSlot.grado || '—'} - ${infoSlot.seccion || '—'}</div>
        <div><b>Docente:</b> ${infoSlot.responsable || '—'}</div>
        <div><b>Motivo:</b> ${infoSlot.motivo || 'Sin detalles adicionales'}</div>
        <div style="margin-top:10px;">
          <button class="btn red darken-2 btn-small waves-effect" style="border-radius:6px; font-weight:600;" onclick="cancelarReserva('${slotKey}')">Cancelar Reserva</button>
        </div>
      </div>`;
  }
  return `
    <div style="color:var(--ink-muted);">
      Esta franja horaria se encuentra disponible. 
      <a href="#!" style="color:var(--pine); font-weight:700; text-decoration:underline;" onclick="intentarAbrirModal('${slotKey}','${slot.hora}'); return false;">Reservar este espacio →</a>
    </div>`;
}

function toggleDetalle(slotKey) {
  const detail = document.getElementById(`detail-${slotKey}`);
  const chevron = document.getElementById(`chevron-${slotKey}`);
  if (!detail) return;
  
  if(detail.classList.contains("open")) {
    detail.classList.remove("open");
    chevron.style.transform = "rotate(0deg)";
  } else {
    detail.classList.add("open");
    chevron.style.transform = "rotate(180deg)";
  }
}

function intentarAbrirModal(slotKey, hora) {
  if (!usuarioLogueado) {
    M.toast({
      html: '🔒 Debes iniciar sesión para realizar una reserva', 
      classes: 'red darken-2'
    });
    setTimeout(() => {
      window.location.href = "InicioSesion.html";
    }, 1200);
    return;
  }

  if (usuarioLogueado.rol === 'estudiante') {
    M.toast({
      html: '🚫 Los estudiantes no pueden reservar salones.',
      classes: 'red darken-2'
    });
    return;
  }

  abrirModal(slotKey, hora);
}

function abrirModal(slotKey, hora) {
  modalSlotKey = slotKey;
  document.getElementById("modalTitulo").textContent = `Reservar Salón ${SALON_ACTUAL}`;
  document.getElementById("modalSubtitle").textContent = `${hora} · ${FECHAS.find(f => f.fecha === fechaActiva)?.etiqueta}`;
  
  document.getElementById("inputMateria").value = "";
  document.getElementById("inputGrado").selectedIndex = 0;
  document.getElementById("inputSeccion").value = "";
  document.getElementById("inputMotivo").value = "";
  
  document.getElementById("labelDocenteNombre").textContent = usuarioLogueado.nombre;
  
  modalInstance.open();
}

async function confirmarReserva() {
  const materia = document.getElementById("inputMateria").value.trim();
  const grado = document.getElementById("inputGrado").value;
  const seccion = document.getElementById("inputSeccion").value.trim();
  const motivo = document.getElementById("inputMotivo").value.trim();
  const responsable = usuarioLogueado ? usuarioLogueado.nombre : "Docente INEM";

  if (!materia) {
    M.toast({html: '⚠️ Ingresa el nombre de la materia', classes: 'amber darken-4'});
    return;
  }
  if (!grado) {
    M.toast({html: '⚠️ Selecciona el grado escolar', classes: 'amber darken-4'});
    return;
  }
  if (!seccion) {
    M.toast({html: '⚠️ Ingresa el grupo o sección', classes: 'amber darken-4'});
    return;
  }

  const [fecha, periodo] = modalSlotKey.split("_");
  const horario = FECHAS.find(f => f.fecha === fechaActiva)?.horario === "B" ? HORARIO_B : HORARIO_A;
  const slotInfo = horario.find(s => s.p === periodo);

  const nuevaReserva = {
    id: 'res_' + Date.now(),
    bloque: parseInt(BLOQUE_ACTUAL, 10),
    salon: SALON_ACTUAL,
    fecha: fecha,
    periodo: periodo,
    hora: slotInfo ? slotInfo.hora : "",
    materia: materia,
    grado: grado,
    seccion: seccion,
    motivo: motivo,
    responsable: responsable
  };

  try {
    const resp = await fetch(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(nuevaReserva)
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || "Error de servidor");
    }
  } catch (err) {
    console.warn("Guardado local activo:", err);
  }

  reservasPorSlot[modalSlotKey] = nuevaReserva;

  modalInstance.close();
  M.toast({html: '✅ Reserva confirmada exitosamente', classes: 'green darken-2'});
  renderSchedule();
}

async function cancelarReserva(slotKey) {
  const reserva = reservasPorSlot[slotKey];
  if (!reserva) return;

  if (!confirm(`¿Deseas cancelar la reserva de "${reserva.materia}"?`)) return;

  try {
    await fetch(`${API_BASE}?id=${encodeURIComponent(reserva.id)}`, { method: "DELETE" });
  } catch (err) {
    console.warn("Cancelación local realizada.");
  }

  delete reservasPorSlot[slotKey];
  M.toast({html: '🗑️ Reserva cancelada', classes: 'red darken-2'});
  renderSchedule();
}

document.addEventListener('DOMContentLoaded', async function() {
  const modalElem = document.querySelector('#modalReserva');
  modalInstance = M.Modal.init(modalElem, { dismissible: true, opacity: 0.4 });

  document.getElementById("pageTitle").textContent = `Salón ${SALON_ACTUAL} — INEM José Félix`;
  document.getElementById("salonTitulo").textContent = `Horario Salón ${SALON_ACTUAL}`;

  await verificarSesion();

  // ── Los estudiantes no pueden entrar a reservar salones ──
  if (usuarioLogueado && usuarioLogueado.rol === 'estudiante') {
    M.toast({
      html: '🚫 Los estudiantes no pueden reservar salones. Te redirigimos a tu horario...',
      classes: 'red darken-2'
    });
    setTimeout(() => {
      window.location.href = 'horario.html';
    }, 1600);
    return;
  }

  renderTabs();
  cargarReservas();
});
</script>
</body>
</html>
